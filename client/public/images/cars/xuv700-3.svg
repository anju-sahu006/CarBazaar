<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500">
  <defs>
    <linearGradient id="cabin-xuv700" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090F1A" />
    </linearGradient>
    <linearGradient id="windshield-xuv700" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.18" />
    </linearGradient>
  </defs>
  <rect width="840" height="500" fill="url(#cabin-xuv700)" />

  <!-- Windshield -->
  <path d="M80 40 L760 40 L790 210 L50 210 Z" fill="url(#windshield-xuv700)" stroke="rgba(255,255,255,0.14)" />

  <!-- Dashboard curve -->
  <path d="M30 220 Q420 175 810 220 L840 420 L0 420 Z" fill="#111827" stroke="#334155" stroke-width="2" />
  <path d="M55 245 Q420 205 785 245" fill="none" stroke="#0F2942" stroke-width="3" opacity="0.7" />

  <!-- Digital Instrument Cluster -->
  <rect x="135" y="238" width="190" height="92" rx="14" fill="#020617" stroke="#3B82F6" stroke-width="2" />
  <circle cx="190" cy="284" r="28" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="130 50" />
  <text x="190" y="289" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">0 km/h</text>
  <circle cx="272" cy="284" r="28" fill="none" stroke="#F97316" stroke-width="4" stroke-dasharray="110 70" />
  <text x="272" y="289" fill="#FDBA74" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">READY</text>

  <!-- Steering Wheel -->
  <circle cx="230" cy="332" r="98" fill="none" stroke="#1E293B" stroke-width="22" />
  <circle cx="230" cy="332" r="98" fill="none" stroke="#475569" stroke-width="2" />
  <circle cx="230" cy="332" r="32" fill="#0F172A" stroke="#475569" stroke-width="2" />
  <line x1="138" y1="326" x2="200" y2="330" stroke="#1E293B" stroke-width="18" />
  <line x1="260" y1="330" x2="322" y2="326" stroke="#1E293B" stroke-width="18" />
  <line x1="230" y1="362" x2="230" y2="424" stroke="#1E293B" stroke-width="18" />
  <text x="230" y="336" fill="#93C5FD" font-family="Inter, sans-serif" font-size="9" font-weight="800" text-anchor="middle">MAHINDRA</text>

  <!-- Infotainment Screen -->
  <rect x="382" y="220" width="168" height="106" rx="12" fill="#0B1324" stroke="#60A5FA" stroke-width="2" />
  <rect x="394" y="232" width="144" height="82" rx="6" fill="#153B66" />
  <text x="466" y="266" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">XUV700 Cockpit</text>
  <text x="466" y="288" fill="#93C5FD" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Apple CarPlay • Nav • Audio</text>

  <!-- Center Console & Gear -->
  <rect x="405" y="352" width="120" height="135" rx="16" fill="#1E293B" stroke="#334155" />
  <rect x="444" y="378" width="42" height="58" rx="10" fill="#0F172A" stroke="#64748B" />
  <circle cx="465" cy="396" r="13" fill="#CBD5E1" />

  <!-- Badge -->
  <rect x="28" y="24" width="196" height="28" rx="14" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" />
  <text x="126" y="42" fill="#FDBA74" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.2">INTERIOR &amp; COCKPIT</text>
  <text x="812" y="42" fill="rgba(255,255,255,0.75)" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="end">Mahindra XUV700</text>
</svg>